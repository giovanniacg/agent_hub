services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DATABASE_NAME: agent_hub
      DATABASE_USER: agent_hub
      DATABASE_PASSWORD: agent_hub
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      USE_POSTGRES: "1"
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_USER: agent_hub
      POSTGRES_PASSWORD: agent_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d agent_hub -U agent_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
